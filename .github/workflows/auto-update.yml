name: Auto-update index.html

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'trigger_temp.txt'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Generate FILES array and update index.html
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const SKIP_DIRS = ['.github', 'node_modules', '_assets'];
          const SKIP_FILES = ['index.html'];
          const SKIP_ROOT_FILES = true;
          const SUPPORTED_EXTENSIONS = ['.html'];

          function detectTag(name, folder) {
            const text = (name + ' ' + folder).toLowerCase();
            if (/定价|价格|价格策略|溢价|毛利|cost|price/i.test(text)) return 'pricing';
            if (/竞品|分析报告|市场|research|趋势|行业|竞争|invest|stock|财报|股票|估值|ipo/i.test(text)) return 'analysis';
            return 'report';
          }

          function walk(dir) {
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            let files = [];
            for (const entry of entries) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (!SKIP_DIRS.includes(entry.name)) {
                  files = files.concat(walk(full));
                }
              } else if (entry.isFile() && SUPPORTED_EXTENSIONS.includes(path.extname(entry.name))) {
                if (SKIP_FILES.includes(entry.name)) continue;
                const rel = full.replace(/^\.\//, '').replace(/\\/g, '/');
                if (SKIP_ROOT_FILES && !rel.includes('/')) continue;
                const folder = path.dirname(rel);
                const name = path.basename(entry.name, '.html');
                const tag = detectTag(name, folder);
                files.push({ name, path: rel, folder, tag });
              }
            }
            return files;
          }

          const files = walk('.');
          const lines = files.map(f =>
            `    { name: '${f.name}', path: '${f.path}', folder: '${f.folder}', tag: '${f.tag}' }`
          );
          const filesArray = `const FILES = [\n${lines.join(',\n')}\n  ];`;
          let html = fs.readFileSync('index.html', 'utf8');
          html = html.replace(/const FILES = [\s\S]*?\];/, filesArray);
          fs.writeFileSync('index.html', html, 'utf8');
          console.log(`Updated index.html with ${files.length} files`);
          const tagStats = {};
          files.forEach(f => { tagStats[f.tag] = (tagStats[f.tag] || 0) + 1; });
          console.log('Tag distribution:', JSON.stringify(tagStats));
          const folders = [...new Set(files.map(f => f.folder))];
          console.log('Detected folders:', folders.join(', '));
          const check = fs.readFileSync('index.html', 'utf8');
          folders.forEach(folder => {
            if (check.includes(folder)) {
              console.log('✅ ' + folder + ' found in index.html');
            } else {
              console.log('❌ ' + folder + ' MISSING from index.html');
            }
          });
          EOF

      - name: Commit and push if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes — index.html already up to date"
          else
            git commit -m "chore: auto-update file list with smart tag detection"
            git push origin HEAD:main
            echo "PUSHED ✓"
          fi
