name: Auto-update index.html

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'README.md'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate FILES array and update index.html
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const SKIP_DIRS = ['.github', 'node_modules', '_assets'];
          const SUPPORTED_EXTENSIONS = ['.html'];

          function walk(dir) {
            const entries = fs.readdirSync(dir, { withFileTypes: true });
            let files = [];
            for (const entry of entries) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) {
                if (!SKIP_DIRS.includes(entry.name)) {
                  files = files.concat(walk(full));
                }
              } else if (entry.isFile() && SUPPORTED_EXTENSIONS.includes(path.extname(entry.name))) {
                const rel = full.replace(/^\.\//, '').replace(/\\/g, '/');
                const folder = path.dirname(rel);
                const name = path.basename(entry.name, '.html');
                files.push({ name, path: rel, folder, tag: 'report' });
              }
            }
            return files;
          }

          const files = walk('.');
          const lines = files.map(f =>
            `    { name: '${f.name}', path: '${f.path}', folder: '${f.folder}', tag: '${f.tag}' }`
          );
          const filesArray = `const FILES = [\n${lines.join(',\n')}\n  ];`;
          let html = fs.readFileSync('index.html', 'utf8');
          html = html.replace(/const FILES = \[\s\S]*?\];/, filesArray);
          fs.writeFileSync('index.html', html, 'utf8');
          console.log(`Updated index.html with ${files.length} files`);
          const folders = [...new Set(files.map(f => f.folder))];
          console.log('Detected folders:', folders.join(', '));
          const check = fs.readFileSync('index.html', 'utf8');
          folders.forEach(folder => {
            if (check.includes(folder)) {
              console.log('✅ ' + folder + ' found in index.html');
            } else {
              console.log('❌ ' + folder + ' MISSING from index.html — walk() bug!');
            }
          });
          EOF

      - name: Commit and push if changed
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes — nothing to commit"
          else
            git commit -m "chore: auto-update file list"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
