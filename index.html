<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分析报告展示站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ==================== Theme Variables ==================== */
    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --surface-hover: #f5f7fa;
      --border: #e2e8f0;
      --text: #1a1a2e;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --accent: #4f46e5;
      --accent-light: #818cf8;
      --accent-bg: #eef2ff;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
      --card-hover-shadow: 0 4px 12px rgba(0,0,0,0.1), 0 8px 32px rgba(79,70,229,0.12);
      --tag-bg: #f1f5f9;
      --tag-text: #475569;
      --sidebar-bg: #ffffff;
      --divider: #e2e8f0;
      --scrollbar: #cbd5e1;
      --preview-bg: #ffffff;
      --radius: 14px;
      --radius-sm: 8px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg: #0a0a0f;
      --surface: #16161d;
      --surface-hover: #1e1e28;
      --border: #2a2a3c;
      --text: #e8eaf6;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #818cf8;
      --accent-light: #a5b4fc;
      --accent-bg: #1e1b4b;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.4), 0 4px 20px rgba(0,0,0,0.3);
      --card-hover-shadow: 0 4px 12px rgba(0,0,0,0.4), 0 8px 40px rgba(130,140,248,0.15);
      --tag-bg: #1e1e2e;
      --tag-text: #94a3b8;
      --sidebar-bg: #12121a;
      --divider: #1e1e2e;
      --scrollbar: #3a3a4d;
      --preview-bg: #0d0d14;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
      overflow: hidden;
    }

    /* ==================== Layout ==================== */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ==================== Header ==================== */
    .header {
      display: flex;
      align-items: center;
      padding: 0 28px;
      height: 64px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      gap: 20px;
      flex-shrink: 0;
      transition: background var(--transition), border-color var(--transition);
      z-index: 100;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
      flex-shrink: 0;
    }

    .header-logo .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #fff;
      box-shadow: 0 2px 8px rgba(79,70,229,0.3);
    }

    .header-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-left: 8px;
    }

    .stat-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--surface-hover);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      transition: all var(--transition);
    }
    .stat-chip .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-link {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color var(--transition);
    }
    .header-link:hover { color: var(--accent); }

    /* ==================== Theme Toggle ==================== */
    .theme-toggle {
      position: relative;
      width: 52px;
      height: 28px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      transition: all var(--transition);
      display: flex;
      align-items: center;
      padding: 3px;
    }
    .theme-toggle:hover {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-bg);
    }

    .theme-toggle-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: transform var(--transition), background var(--transition);
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      position: relative;
    }
    .theme-toggle-thumb .sun,
    .theme-toggle-thumb .moon {
      position: absolute;
      transition: opacity 0.25s, transform 0.25s;
    }
    .theme-toggle-thumb .sun { opacity: 0; transform: rotate(90deg) scale(0.5); }
    .theme-toggle-thumb .moon { opacity: 1; transform: rotate(0) scale(1); }

    [data-theme="dark"] .theme-toggle-thumb {
      transform: translateX(24px);
    }
    [data-theme="dark"] .theme-toggle-thumb .sun {
      opacity: 1; transform: rotate(0) scale(1);
    }
    [data-theme="dark"] .theme-toggle-thumb .moon {
      opacity: 0; transform: rotate(-90deg) scale(0.5);
    }

    /* ==================== Main Content ==================== */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ==================== Sidebar ==================== */
    .sidebar {
      width: 240px;
      min-width: 240px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background var(--transition), border-color var(--transition);
    }

    .sidebar-header {
      padding: 16px 20px 8px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 16px;
    }
    .sidebar-scroll::-webkit-scrollbar { width: 4px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 2px; }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition);
      color: var(--text-secondary);
      font-size: 13.5px;
      font-weight: 500;
      margin-bottom: 2px;
      border: 1px solid transparent;
      user-select: none;
    }
    .nav-item:hover {
      background: var(--surface-hover);
      color: var(--text);
    }
    .nav-item.active {
      background: var(--accent-bg);
      color: var(--accent);
      border-color: transparent;
    }
    [data-theme="dark"] .nav-item.active {
      background: rgba(130,140,248,0.12);
      color: var(--accent-light);
    }

    .nav-item .icon { font-size: 16px; flex-shrink: 0; }
    .nav-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nav-item .count {
      font-size: 11px;
      background: var(--tag-bg);
      color: var(--tag-text);
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 600;
      flex-shrink: 0;
      transition: all var(--transition);
    }
    .nav-item.active .count {
      background: rgba(79,70,229,0.15);
      color: var(--accent);
    }
    [data-theme="dark"] .nav-item.active .count {
      background: rgba(130,140,248,0.15);
      color: var(--accent-light);
    }

    /* ==================== Content Area ==================== */
    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px 40px;
    }
    .content-scroll::-webkit-scrollbar { width: 5px; }
    .content-scroll::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }

    /* ==================== Section Header ==================== */
    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .section-title .folder-emoji { font-size: 20px; }

    .section-count {
      font-size: 13px;
      color: var(--text-muted);
      background: var(--surface-hover);
      border: 1px solid var(--border);
      padding: 2px 10px;
      border-radius: 20px;
    }

    .section-divider {
      flex: 1;
      height: 1px;
      background: var(--border);
      margin-top: 4px;
    }

    /* ==================== File Grid ==================== */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 14px;
    }

    .file-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }
    .file-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      opacity: 0;
      transition: opacity var(--transition);
    }
    .file-card:hover {
      border-color: var(--accent);
      box-shadow: var(--card-hover-shadow);
      transform: translateY(-2px);
    }
    .file-card:hover::before { opacity: 1; }

    .file-card-header {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .file-card-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      background: var(--accent-bg);
    }
    [data-theme="dark"] .file-card-icon {
      background: rgba(130,140,248,0.12);
    }

    .file-card-info { flex: 1; min-width: 0; }

    .file-card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
      word-break: break-all;
    }

    .file-card-path {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .file-card-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tag-type-analysis { background: #dbeafe; color: #1d4ed8; }
    .tag-type-pricing   { background: #dcfce7; color: #15803d; }
    .tag-type-report    { background: #f3e8ff; color: #7e22ce; }
    .tag-type-default   { background: var(--tag-bg); color: var(--tag-text); }

    [data-theme="dark"] .tag-type-analysis { background: #1e3a5f; color: #93c5fd; }
    [data-theme="dark"] .tag-type-pricing   { background: #1a3a2a; color: #86efac; }
    [data-theme="dark"] .tag-type-report    { background: #3b1f5e; color: #d8b4fe; }

    .file-card-arrow {
      margin-left: auto;
      color: var(--text-muted);
      font-size: 16px;
      transition: all var(--transition);
      flex-shrink: 0;
      padding-top: 2px;
    }
    .file-card:hover .file-card-arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    /* ==================== Empty State ==================== */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 40px;
      gap: 16px;
      text-align: center;
    }
    .empty-icon { font-size: 64px; opacity: 0.25; }
    .empty-title { font-size: 16px; font-weight: 600; color: var(--text-secondary); }
    .empty-desc { font-size: 13px; color: var(--text-muted); max-width: 300px; line-height: 1.6; }

    /* ==================== Preview Pane ==================== */
    .preview-pane {
      display: none;
      flex-direction: column;
      height: 100%;
      background: var(--preview-bg);
      transition: background var(--transition);
    }
    .preview-pane.open { display: flex; }

    .preview-toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      transition: all var(--transition);
    }

    .preview-back {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all var(--transition);
      font-family: inherit;
    }
    .preview-back:hover { border-color: var(--accent); color: var(--accent); }

    .preview-title {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .preview-actions { display: flex; gap: 8px; }

    .btn-icon {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      width: 34px; height: 34px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all var(--transition);
    }
    .btn-icon:hover { border-color: var(--accent); color: var(--accent); }
    .btn-icon.danger:hover { border-color: #ef4444; color: #ef4444; }

    .preview-frame-wrap {
      flex: 1;
      position: relative;
    }

    .preview-loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      gap: 12px;
      color: var(--text-muted);
      font-size: 14px;
      z-index: 10;
      transition: opacity 0.3s;
    }
    .preview-loading.hidden { opacity: 0; pointer-events: none; }

    .spinner-ring {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .preview-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: var(--preview-bg);
    }

    /* ==================== GitHub Link Badge ==================== */
    .gh-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface-hover);
      transition: all var(--transition);
    }
    .gh-badge:hover { border-color: var(--accent); color: var(--accent); }

    /* ==================== Animations ==================== */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .file-card {
      animation: fadeInUp 0.4s ease backwards;
    }
    .file-grid .file-card:nth-child(1) { animation-delay: 0.05s; }
    .file-grid .file-card:nth-child(2) { animation-delay: 0.1s; }
    .file-grid .file-card:nth-child(3) { animation-delay: 0.15s; }
    .file-grid .file-card:nth-child(4) { animation-delay: 0.2s; }
    .file-grid .file-card:nth-child(5) { animation-delay: 0.25s; }
    .file-grid .file-card:nth-child(6) { animation-delay: 0.3s; }

    /* ==================== Responsive ==================== */
    @media (max-width: 768px) {
      .sidebar { width: 180px; min-width: 180px; }
      .file-grid { grid-template-columns: 1fr; }
      .header-stats { display: none; }
    }
  </style>
</head>
<body>

<div class="app">
  <!-- Header -->

    <div class="header-logo">
      <div class="logo-icon">📊</div>
      分析报告展示站

    <div class="header-stats">
      <div class="stat-chip">
        <div class="dot"></div>
        <span id="totalCount">0 份报告</span>

        <span id="folderCount">0 个项目</span>

    <div class="header-actions">

  <!-- Main -->

    <!-- Content -->
    <div class="content">
      <div class="content-scroll" id="fileListView">

          <div class="section-divider"></div>

        <div class="file-grid" id="fileGrid"></div>
      </div>

      <!-- Preview Pane -->
      <div class="preview-pane" id="previewPane">
        <div class="preview-toolbar">
          <button class="preview-back" id="backBtn">
            ← 返回
          </button>
          <div class="preview-title" id="previewTitle">预览中...</div>
          <div class="preview-actions">
            <button class="btn-icon" id="openNewTab" title="新窗口打开">↗</button>
            <button class="btn-icon danger" id="closePreview" title="关闭">✕</button>
          </div>
        </div>
        <div class="preview-frame-wrap">
          <div class="preview-loading" id="previewLoading">
            <div class="spinner-ring"></div>
            加载中...
          </div>
          <iframe class="preview-frame" id="previewFrame"></iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // ==================== Data ====================
  const FILES = [
    { name: '不需要慢炖的慢炖锅', path: '3合1多功能慢炖锅套餐/不需要慢炖的慢炖锅.html', folder: '3合1多功能慢炖锅套餐', tag: 'report' },

    { name: '竞品分析报告', path: '3合1多功能慢炖锅套餐/竞品分析报告.html', folder: '3合1多功能慢炖锅套餐', tag: 'analysis' },
    { name: '华为韬定律_散热封装材料投资分析', path: '投资研究/华为韬定律_散热封装材料投资分析.html', folder: '投资研究', tag: 'report' },
    { name: '0602绩效复盘', path: '日常汇报/0602绩效复盘.html', folder: '日常汇报', tag: 'report' },
    { name: '产品心理定价测算表', path: '通用工具/产品心理定价测算表.html', folder: '通用工具', tag: 'pricing' },
    { name: 'HEPA滤网定价策略分析', path: '除螨仪/HEPA滤网定价策略分析.html', folder: '除螨仪', tag: 'pricing' }
  ];

  const FOLDER_ICONS = {
    '3合1多功能慢炖锅套餐': '🍲',
    '除螨仪': '🧹',
    '投资研究': '📈',
    'default': '📁',
  };

  const TAG_CONFIG = {
    analysis: { label: '分析',   cls: 'tag-type-analysis' },
    pricing:  { label: '💰 定价', cls: 'tag-type-pricing'  },
    report:   { label: '报告',   cls: 'tag-type-report'    },
    default:  { label: '文件',   cls: 'tag-type-default'   },
  };

  // ==================== State ====================
  let currentFolder = '';
  let isPreviewOpen = false;

  // ==================== Theme ====================
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('showcase_theme', theme);
  }

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    applyTheme(current === 'dark' ? 'light' : 'dark');
  }

  // Init theme from localStorage
  const savedTheme = localStorage.getItem('showcase_theme') || 'dark';
  applyTheme(savedTheme);

  document.getElementById('themeToggle').addEventListener('click', toggleTheme);

  // ==================== Render Sidebar ====================
  function renderSidebar() {
    const counts = {};
    FILES.forEach(f => {
      counts[f.folder] = (counts[f.folder] || 0) + 1;
    });
    const total = FILES.length;

    document.getElementById('nav-total-count').textContent = total;
    document.getElementById('totalCount').textContent = `${total} 份报告`;
    document.getElementById('folderCount').textContent = `${Object.keys(counts).length} 个项目`;

    const folders = Object.keys(counts).sort();
    let navHtml = '';
    folders.forEach(folder => {
      const icon = FOLDER_ICONS[folder] || FOLDER_ICONS['default'];
      navHtml += `<div class="nav-item${currentFolder === folder ? ' active' : ''}" data-folder="${folder}">
        <span class="icon">${icon}</span>
        <span class="name">${folder}</span>
        <span class="count">${counts[folder]}</span>
      </div>`;
    });
    document.getElementById('folderNav').innerHTML = navHtml;

    document.querySelectorAll('.nav-item[data-folder]').forEach(el => {
      el.addEventListener('click', () => {
        currentFolder = el.dataset.folder;
        renderSidebar();
        renderGrid();
        if (isPreviewOpen) closePreview();
      });
    });
  }

  // ==================== Render Grid ====================
  function renderGrid() {
    const filtered = currentFolder
      ? FILES.filter(f => f.folder === currentFolder)
      : FILES;

    const icon = currentFolder
      ? (FOLDER_ICONS[currentFolder] || '📁')
      : '🏠';
    const name = currentFolder || '全部报告';

    document.getElementById('sectionTitle').innerHTML =
      `<span class="folder-emoji">${icon}</span> ${name}`;
    document.getElementById('sectionCount').textContent = `${filtered.length} 份`;

    if (!filtered.length) {
      document.getElementById('fileGrid').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <div class="empty-title">该分类下暂无报告</div>
          <div class="empty-desc">把 HTML 文件上传到对应项目文件夹，刷新页面即可显示</div>
        </div>`;
      return;
    }

    let html = '';
    filtered.forEach(f => {
      const cfg = TAG_CONFIG[f.tag] || TAG_CONFIG.default;
      html += `<div class="file-card" data-path="${f.path}" data-name="${f.name}">
        <div class="file-card-header">
          <div class="file-card-icon">${icon}</div>
          <div class="file-card-info">
            <div class="file-card-name">${f.name}</div>
            <div class="file-card-path">${f.path}</div>
          </div>
          <div class="file-card-arrow">→</div>
        </div>
        <div class="file-card-tags">
          <span class="tag ${cfg.cls}">${cfg.label}</span>
          <span class="tag tag-type-default">${f.folder}</span>
        </div>
      </div>`;
    });

    document.getElementById('fileGrid').innerHTML = html;

    document.querySelectorAll('.file-card').forEach(card => {
      card.addEventListener('click', () => {
        openPreview(card.dataset.path, card.dataset.name);
      });
    });
  }

  // ==================== Preview ====================
  function openPreview(path, name) {
    isPreviewOpen = true;
    document.getElementById('fileListView').style.display = 'none';
    document.getElementById('previewPane').classList.add('open');
    document.getElementById('previewTitle').textContent = name;
    document.getElementById('previewLoading').classList.remove('hidden');
    document.getElementById('previewFrame').src = path;
  }

  function closePreview() {
    isPreviewOpen = false;
    document.getElementById('previewPane').classList.remove('open');
    document.getElementById('fileListView').style.display = '';
    document.getElementById('previewFrame').src = 'about:blank';
  }

  function openNewTab() {
    const src = document.getElementById('previewFrame').src;
    if (src && src !== 'about:blank') window.open(src, '_blank');
  }

  document.getElementById('backBtn').addEventListener('click', closePreview);
  document.getElementById('closePreview').addEventListener('click', closePreview);
  document.getElementById('openNewTab').addEventListener('click', openNewTab);
  document.getElementById('previewFrame').addEventListener('load', () => {
    document.getElementById('previewLoading').classList.add('hidden');
  });

  // ==================== Init ====================
  renderSidebar();
  renderGrid();

  // Keyboard shortcut: Esc to close preview
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && isPreviewOpen) closePreview();
  });
</script>

</body>
</html>
